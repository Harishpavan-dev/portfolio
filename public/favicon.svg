<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#12122A"/>
    </linearGradient>

    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Square Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.3"/>

  <!-- "H" Monogram with Glow -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <rect x="130" y="120" width="60" height="272" rx="20" fill="url(#brandGrad)"/>
    <!-- Right vertical bar -->
    <rect x="322" y="120" width="60" height="272" rx="20" fill="url(#brandGrad)"/>
    <!-- Horizontal crossbar -->
    <rect x="130" y="226" width="252" height="60" rx="18" fill="url(#brandGrad)"/>
  </g>

  <!-- Accent Cyan Brand Dot -->
  <circle cx="410" cy="360" r="32" fill="#00F2FE" />
</svg>
